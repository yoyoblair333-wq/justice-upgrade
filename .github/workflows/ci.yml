name: ci

on:
  push:
  pull_request:

env:
  GENVM_VERSION: v0.2.16

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache GenVM SDK and linter artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gltest-direct
            ~/.cache/genvm-linter
          key: genvm-v0.2.16
      - name: Verify (lint + direct-mode tests)
        run: bash scripts/verify.sh

  web:
    # Offline web tests: build web/ and run the page in Chromium with every
    # network request blocked (fallback snapshot, labels, text-only rendering).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Playwright Chromium + its OS libraries
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Offline web tests
        run: npm test
